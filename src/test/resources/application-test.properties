# Profile used only by the context smoke test, which runs when TEST_DB_URL
# points at a throwaway Postgres. Every value here is deliberately a fixed test
# value, never a real credential.

spring.datasource.url=${TEST_DB_URL}
spring.datasource.username=${TEST_DB_USERNAME:postgres}
spring.datasource.password=${TEST_DB_PASSWORD:postgres}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.sql.init.mode=never

# 48 bytes of base64 padding, valid for HS384 but not a secret anyone can reuse.
app.jwt.secret=dGVzdC1vbmx5LWtleS1uZXZlci11c2VkLW91dHNpZGUtdW5pdC10ZXN0cy0wMTIzNDU=
app.jwt.refresh-cookie-secure=false
app.jwt.refresh-cookie-same-site=Lax

app.bootstrap.admin.enabled=false

app.cors.allowed-origins=http://localhost:3000

app.storage.provider=local
app.media.upload-dir=${java.io.tmpdir}/ideiasmidias-test-uploads
app.media.public-url-prefix=/uploads/media/
app.media.max-file-size-bytes=209715200
app.media.video.transcode-enabled=false

app.analytics.dedupe-window-minutes=30
app.cache.public-max-age-seconds=0
app.cache.public-stale-while-revalidate-seconds=0
