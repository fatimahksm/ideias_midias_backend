# Configuration for the integration test profile (used by *IT tests via mvn verify).
# Defaults target a local PostgreSQL; CI overrides the DB_* / APP_JWT_SECRET env vars.
server.port=0

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ideias_midias_test}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# The integration test boots the whole context to prove the app wires up and the
# JPA mappings are consistent. Hibernate generates the schema here (create-drop) so
# the test is self-contained and does not depend on Flyway auto-configuration.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.flyway.enabled=false

spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# A valid Base64-encoded secret long enough for HMAC signing (tests only).
app.jwt.secret=${APP_JWT_SECRET:bXktdGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItdW5pdC10ZXN0cy1uZWVkcy10by1iZS1sb25nLWVub3VnaA==}
app.jwt.expiration-ms=900000

app.bootstrap.admin.enabled=false

app.media.upload-dir=${APP_MEDIA_UPLOAD_DIR:target/test-uploads/media}
app.media.public-url-prefix=/uploads/media/
app.media.max-file-size-bytes=10485760
