server.port=${SERVER_PORT:8080}

spring.datasource.url=${STAGING_DB_URL}
spring.datasource.username=${STAGING_DB_USERNAME}
spring.datasource.password=${STAGING_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.validate-on-migrate=true

spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${APP_JWT_REFRESH_EXPIRATION_MS:604800000}
app.jwt.refresh-cookie-name=${APP_JWT_REFRESH_COOKIE_NAME:admin_refresh_token}
app.jwt.refresh-cookie-secure=${APP_JWT_REFRESH_COOKIE_SECURE:true}
app.jwt.refresh-cookie-same-site=${APP_JWT_REFRESH_COOKIE_SAME_SITE:None}

app.bootstrap.admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap.admin.full-name=${APP_BOOTSTRAP_ADMIN_FULL_NAME:Super Admin}
app.bootstrap.admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:admin@example.com}
app.bootstrap.admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:CHANGE_ME_NOW}

app.media.upload-dir=${APP_MEDIA_UPLOAD_DIR:uploads/media}
app.media.public-url-prefix=${APP_MEDIA_PUBLIC_URL_PREFIX:/uploads/media/}
app.media.max-file-size-bytes=${APP_MEDIA_MAX_FILE_SIZE_BYTES:10485760}

app.storage.provider=${APP_STORAGE_PROVIDER:local}
app.storage.r2.account-id=${APP_STORAGE_R2_ACCOUNT_ID:}
app.storage.r2.access-key-id=${APP_STORAGE_R2_ACCESS_KEY_ID:}
app.storage.r2.secret-access-key=${APP_STORAGE_R2_SECRET_ACCESS_KEY:}
app.storage.r2.bucket=${APP_STORAGE_R2_BUCKET:}
app.storage.r2.public-base-url=${APP_STORAGE_R2_PUBLIC_BASE_URL:}

app.media.video.transcode-enabled=${APP_MEDIA_VIDEO_TRANSCODE_ENABLED:true}
app.media.video.ffmpeg-path=${APP_MEDIA_VIDEO_FFMPEG_PATH:ffmpeg}
# Longest side of a delivered video. Phone clips are often 4K, which nobody
# on a slow connection can stream; 0 keeps the original size.
app.media.video.max-long-side=${APP_MEDIA_VIDEO_MAX_LONG_SIDE:1280}

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:15}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:3}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:10MB}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.health.db.enabled=true

logging.level.org.flywaydb=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN

# Analytics: the same visitor re-opening the same page inside this window is
# counted once, so refreshing or navigating back and forth does not inflate
# the dashboard. Set to 0 to record every single page open.
app.analytics.dedupe-window-minutes=${APP_ANALYTICS_DEDUPE_WINDOW_MINUTES:30}

# How long a public GET may be reused by browsers, proxies and the frontend's
# own fetch cache. Public content changes only when the owner edits it, so a
# short window turns a burst of visitors into one query. 0 disables caching.
app.cache.public-max-age-seconds=${APP_CACHE_PUBLIC_MAX_AGE_SECONDS:60}
app.cache.public-stale-while-revalidate-seconds=${APP_CACHE_PUBLIC_STALE_WHILE_REVALIDATE_SECONDS:300}
