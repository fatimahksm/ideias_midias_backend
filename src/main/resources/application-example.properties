spring.application.name=ideias-midias-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/ideias_midias
spring.datasource.username=YOUR_DB_USERNAME
spring.datasource.password=YOUR_DB_PASSWORD

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# JWT
app.jwt.secret=YOUR_BASE64_SECRET
app.jwt.expiration-ms=86400000

# Bootstrap admin
app.bootstrap.admin.enabled=false
app.bootstrap.admin.full-name=Super Admin
app.bootstrap.admin.email=admin@example.com
app.bootstrap.admin.password=CHANGE_ME

# Media storage
app.media.upload-dir=uploads/media
app.media.public-url-prefix=/uploads/media/
app.media.max-file-size-bytes=10485760

# Multipart upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB