server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ideias_midias_db1}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}


spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

spring.jpa.hibernate.ddl-auto=validate

spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:900000}

app.bootstrap.admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap.admin.full-name=${APP_BOOTSTRAP_ADMIN_FULL_NAME:Super Admin}
app.bootstrap.admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:admin@example.com}
app.bootstrap.admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:CHANGE_ME_NOW}

app.media.upload-dir=${APP_MEDIA_UPLOAD_DIR:uploads/media}
app.media.public-url-prefix=${APP_MEDIA_PUBLIC_URL_PREFIX:/uploads/media/}
app.media.max-file-size-bytes=${APP_MEDIA_MAX_FILE_SIZE_BYTES:10485760}

app.storage.provider=${APP_STORAGE_PROVIDER:local}
app.storage.r2.account-id=${APP_STORAGE_R2_ACCOUNT_ID:}
app.storage.r2.access-key-id=${APP_STORAGE_R2_ACCESS_KEY_ID:}
app.storage.r2.secret-access-key=${APP_STORAGE_R2_SECRET_ACCESS_KEY:}
app.storage.r2.bucket=${APP_STORAGE_R2_BUCKET:}
app.storage.r2.public-base-url=${APP_STORAGE_R2_PUBLIC_BASE_URL:}

app.media.video.transcode-enabled=${APP_MEDIA_VIDEO_TRANSCODE_ENABLED:true}
app.media.video.ffmpeg-path=${APP_MEDIA_VIDEO_FFMPEG_PATH:ffmpeg}
# Longest side of a delivered video. Phone clips are often 4K, which nobody
# on a slow connection can stream; 0 keeps the original size.
app.media.video.max-long-side=1280

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}

app.jwt.refresh-expiration-ms=604800000
app.jwt.refresh-cookie-name=admin_refresh_token
app.jwt.refresh-cookie-secure=false
app.jwt.refresh-cookie-same-site=Lax

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.db.enabled=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

logging.level.org.flywaydb=INFO

# Analytics: the same visitor re-opening the same page inside this window is
# counted once, so refreshing or navigating back and forth does not inflate
# the dashboard. Set to 0 to record every single page open.
app.analytics.dedupe-window-minutes=30
