server.port=${SERVER_PORT:8080}

spring.datasource.url=${PROD_DB_URL}
spring.datasource.username=${PROD_DB_USERNAME}
spring.datasource.password=${PROD_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.validate-on-migrate=true

spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${APP_JWT_REFRESH_EXPIRATION_MS:604800000}
app.jwt.refresh-cookie-name=${APP_JWT_REFRESH_COOKIE_NAME:admin_refresh_token}
app.jwt.refresh-cookie-secure=true
app.jwt.refresh-cookie-same-site=${APP_JWT_REFRESH_COOKIE_SAME_SITE:None}

app.bootstrap.admin.enabled=false

app.media.upload-dir=${APP_MEDIA_UPLOAD_DIR:/var/app/uploads/media}
app.media.public-url-prefix=${APP_MEDIA_PUBLIC_URL_PREFIX:/uploads/media/}
app.media.max-file-size-bytes=${APP_MEDIA_MAX_FILE_SIZE_BYTES:10485760}

# Use "r2" in production so uploads persist across redeploys and are shared
# across every instance behind the load balancer.
app.storage.provider=${APP_STORAGE_PROVIDER:local}
app.storage.r2.account-id=${APP_STORAGE_R2_ACCOUNT_ID:}
app.storage.r2.access-key-id=${APP_STORAGE_R2_ACCESS_KEY_ID:}
app.storage.r2.secret-access-key=${APP_STORAGE_R2_SECRET_ACCESS_KEY:}
app.storage.r2.bucket=${APP_STORAGE_R2_BUCKET:}
app.storage.r2.public-base-url=${APP_STORAGE_R2_PUBLIC_BASE_URL:}

app.media.video.transcode-enabled=${APP_MEDIA_VIDEO_TRANSCODE_ENABLED:true}
app.media.video.ffmpeg-path=${APP_MEDIA_VIDEO_FFMPEG_PATH:ffmpeg}

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:10MB}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.db.enabled=true

logging.level.org.flywaydb=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN